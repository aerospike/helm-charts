name: Package Connector Helm Charts

# Packages selected connector Helm charts into docs/, refreshes docs/index.yaml,
# and opens a pull request to main.
#
# Intended release flow (single workflow dispatch, typically from main):
#   1. Set branch_name (JIRA id, e.g. CONNECTOR-1645) and select charts
#   2. Workflow checks out the feature branch if it exists, otherwise main to seed a new one
#   3. Bump versions, package charts, refresh docs/index.yaml, push to the feature branch, open PR to main
#   4. Integration tests run automatically on the feature branch after packaging succeeds
#   5. Review and merge the PR to main after tests pass

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: JIRA feature branch and PR head (e.g. CONNECTOR-1645)
        required: true
      pr_title:
        description: PR title suffix after the JIRA prefix (default - [Streaming] release title with current Mon'YY in IST)
        required: false
        default: ""
      version_bump:
        description: Default version bump (patch, minor, major, none) or explicit semver for all selected charts
        type: string
        required: false
        default: patch
      chart_version_overrides:
        description: Optional JSON map of chart directory to bump mode or semver (overrides version_bump per chart)
        type: string
        required: false
        default: ""
      aerospike_elasticsearch_outbound:
        description: aerospike-elasticsearch-outbound
        type: boolean
        required: true
        default: true
      aerospike_esp_outbound:
        description: aerospike-esp-outbound
        type: boolean
        required: true
        default: true
      aerospike_jms_inbound:
        description: aerospike-jms-inbound
        type: boolean
        required: true
        default: true
      aerospike_jms_outbound:
        description: aerospike-jms-outbound
        type: boolean
        required: true
        default: true
      aerospike_kafka_outbound:
        description: aerospike-kafka-outbound
        type: boolean
        required: true
        default: true
      aerospike_pulsar_outbound:
        description: aerospike-pulsar-outbound
        type: boolean
        required: true
        default: true
      aerospike_xdr_proxy:
        description: aerospike-xdr-proxy
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: package-connector-charts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-connector-charts:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.selected-charts.outputs.charts }}
      feature_branch: ${{ steps.feature-branch.outputs.name }}
      git_ref: ${{ steps.test-git-ref.outputs.ref }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Resolve feature branch
        id: feature-branch
        env:
          INPUT_BRANCH_NAME: ${{ github.event.inputs.branch_name }}
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"

          if [ -z "${INPUT_BRANCH_NAME}" ]; then
            echo "::error::branch_name is required (e.g. CONNECTOR-1645)."
            exit 1
          fi

          feature_branch="${INPUT_BRANCH_NAME}"

          if [ "${feature_branch}" = "main" ]; then
            echo "::error::branch_name must be a JIRA feature branch, not main."
            exit 1
          fi

          echo "Feature branch: ${feature_branch}"

          if git ls-remote --heads "${remote}" "${feature_branch}" | grep -q .; then
            checkout_ref="${feature_branch}"
            echo "Feature branch exists; checking it out for Helm updates."
          else
            checkout_ref="main"
            echo "Feature branch does not exist yet; checking out main to create it."
          fi

          echo "name=${feature_branch}" >> "${GITHUB_OUTPUT}"
          echo "checkout_ref=${checkout_ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.feature-branch.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Resolve selected charts
        id: selected-charts
        env:
          AEROSPIKE_ELASTICSEARCH_OUTBOUND: ${{ github.event.inputs.aerospike_elasticsearch_outbound }}
          AEROSPIKE_ESP_OUTBOUND: ${{ github.event.inputs.aerospike_esp_outbound }}
          AEROSPIKE_JMS_INBOUND: ${{ github.event.inputs.aerospike_jms_inbound }}
          AEROSPIKE_JMS_OUTBOUND: ${{ github.event.inputs.aerospike_jms_outbound }}
          AEROSPIKE_KAFKA_OUTBOUND: ${{ github.event.inputs.aerospike_kafka_outbound }}
          AEROSPIKE_PULSAR_OUTBOUND: ${{ github.event.inputs.aerospike_pulsar_outbound }}
          AEROSPIKE_XDR_PROXY: ${{ github.event.inputs.aerospike_xdr_proxy }}
        run: |
          set -euo pipefail

          charts=()
          if [ "${AEROSPIKE_ELASTICSEARCH_OUTBOUND}" = "true" ]; then charts+=("aerospike-elasticsearch-outbound"); fi
          if [ "${AEROSPIKE_ESP_OUTBOUND}" = "true" ]; then charts+=("aerospike-esp-outbound"); fi
          if [ "${AEROSPIKE_JMS_INBOUND}" = "true" ]; then charts+=("aerospike-jms-inbound"); fi
          if [ "${AEROSPIKE_JMS_OUTBOUND}" = "true" ]; then charts+=("aerospike-jms-outbound"); fi
          if [ "${AEROSPIKE_KAFKA_OUTBOUND}" = "true" ]; then charts+=("aerospike-kafka-outbound"); fi
          if [ "${AEROSPIKE_PULSAR_OUTBOUND}" = "true" ]; then charts+=("aerospike-pulsar-outbound"); fi
          if [ "${AEROSPIKE_XDR_PROXY}" = "true" ]; then charts+=("aerospike-xdr-proxy"); fi

          if [ "${#charts[@]}" -eq 0 ]; then
            echo "::error::Select at least one connector chart to package."
            exit 1
          fi

          {
            echo "charts<<EOF"
            printf '%s\n' "${charts[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "Selected charts:"
          printf '  - %s\n' "${charts[@]}"

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Bump chart versions and update README tags
        if: >-
          ${{
            (github.event.inputs.version_bump != 'none' && github.event.inputs.version_bump != 'skip' && github.event.inputs.version_bump != '')
            || (github.event.inputs.chart_version_overrides != '')
          }}
        env:
          CHARTS: ${{ steps.selected-charts.outputs.charts }}
          VERSION_BUMP: ${{ github.event.inputs.version_bump || 'patch' }}
          CHART_VERSION_OVERRIDES: ${{ github.event.inputs.chart_version_overrides }}
        run: |
          set -euo pipefail

          bump_version() {
            local version="${1//\"/}"
            local bump_type="${2,,}"

            if [[ "${bump_type}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "${bump_type}"
              return
            fi

            local major minor patch
            IFS='.' read -r major minor patch <<< "${version}"

            case "${bump_type}" in
              patch)
                echo "${major}.${minor}.$((patch + 1))"
                ;;
              minor)
                echo "${major}.$((minor + 1)).0"
                ;;
              major)
                echo "$((major + 1)).0.0"
                ;;
              *)
                echo "::error::Unknown bump type '${2}'. Use patch, minor, major, none, skip, or an explicit version (e.g. 4.0.0)." >&2
                exit 1
                ;;
            esac
          }

          should_skip_bump() {
            local bump_type="${1,,}"
            [ -z "${bump_type}" ] || [ "${bump_type}" = "none" ] || [ "${bump_type}" = "skip" ]
          }

          resolve_bump_type() {
            local chart="$1"
            local override=""

            if [ -n "${CHART_VERSION_OVERRIDES}" ]; then
              override="$(echo "${CHART_VERSION_OVERRIDES}" | jq -r --arg chart "${chart}" '.[$chart] // empty')"
            fi

            if [ -n "${override}" ] && [ "${override}" != "null" ]; then
              echo "${override}"
            else
              echo "${VERSION_BUMP}"
            fi
          }

          if [ -n "${CHART_VERSION_OVERRIDES}" ]; then
            if ! echo "${CHART_VERSION_OVERRIDES}" | jq -e 'type == "object"' >/dev/null; then
              echo "::error::chart_version_overrides must be a JSON object, e.g. {\"aerospike-kafka-outbound\":\"6.0.3\"}"
              exit 1
            fi

            while IFS= read -r chart_key; do
              [ -n "${chart_key}" ] || continue
              if ! grep -qx "${chart_key}" <<< "${CHARTS}"; then
                echo "::error::chart_version_overrides contains unselected or unknown chart '${chart_key}'"
                exit 1
              fi
            done <<< "$(echo "${CHART_VERSION_OVERRIDES}" | jq -r 'keys[]')"
          fi

          version_changes=()

          while IFS= read -r chart; do
            [ -n "${chart}" ] || continue

            chart_yaml="${chart}/Chart.yaml"
            if [ ! -f "${chart_yaml}" ]; then
              echo "::error::Missing ${chart_yaml}"
              exit 1
            fi

            old_version="$(grep '^version:' "${chart_yaml}" | head -n1 | awk '{print $2}' | tr -d '"')"
            chart_bump="$(resolve_bump_type "${chart}")"

            if should_skip_bump "${chart_bump}"; then
              echo "${chart}: keeping ${old_version}"
              continue
            fi

            new_version="$(bump_version "${old_version}" "${chart_bump}")"

            sed -i "s/^version: .*/version: \"${new_version}\"/" "${chart_yaml}"
            sed -i "s/^appVersion: .*/appVersion: \"${new_version}\"/" "${chart_yaml}"

            readme="${chart}/README.md"
            if [ -f "${readme}" ]; then
              sed -i "s/tag: \"${old_version}\"/tag: \"${new_version}\"/" "${readme}"
            fi

            version_changes+=("| ${chart} | ${old_version} → ${new_version} (${chart_bump}) |")
            echo "${chart}: ${old_version} -> ${new_version} (${chart_bump})"
          done <<< "${CHARTS}"

          {
            echo "summary<<EOF"
            printf '%s\n' "${version_changes[@]}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Verify connector Docker images exist
        env:
          CHARTS: ${{ steps.selected-charts.outputs.charts }}
        run: |
          set -euo pipefail

          while IFS= read -r chart; do
            [ -n "${chart}" ] || continue

            chart_yaml="${chart}/Chart.yaml"
            values_yaml="${chart}/values.yaml"
            app_version="$(grep '^appVersion:' "${chart_yaml}" | head -n1 | awk '{print $2}' | tr -d '"')"
            repository="$(grep 'repository:' "${values_yaml}" | head -n1 | awk '{print $2}')"
            image_tag="$(grep 'tag:' "${values_yaml}" | head -n1 | awk '{print $2}' | tr -d '"')"

            if [ -z "${image_tag}" ]; then
              image_tag="${app_version}"
            fi

            image="${repository}:${image_tag}"
            echo "Checking Docker image ${image}"

            http_code="$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/${repository}/tags/${image_tag}/")"
            if [ "${http_code}" != "200" ]; then
              echo "::error::Docker image not found: ${image} (HTTP ${http_code}). Publish the connector image before releasing this chart version."
              exit 1
            fi

            echo "${image} exists"
          done <<< "${CHARTS}"

      - name: Package selected connector charts
        env:
          CHARTS: ${{ steps.selected-charts.outputs.charts }}
          TZ: Asia/Kolkata
        run: |
          set -euo pipefail

          chart_args=()
          while IFS= read -r chart; do
            [ -n "${chart}" ] || continue
            chart_args+=("${chart}")
          done <<< "${CHARTS}"

          helm package "${chart_args[@]}" --destination docs/

      - name: Regenerate Helm repository index
        env:
          CHARTS: ${{ steps.selected-charts.outputs.charts }}
          TZ: Asia/Kolkata
        run: |
          set -euo pipefail

          # Index only newly packaged charts so historical `created` timestamps
          # in docs/index.yaml are preserved. TZ=Asia/Kolkata keeps new entries
          # in +05:30 like prior releases (GHA default UTC otherwise).
          staging="$(mktemp -d)"
          trap 'rm -rf "${staging}"' EXIT

          while IFS= read -r chart; do
            [ -n "${chart}" ] || continue
            version="$(grep '^version:' "${chart}/Chart.yaml" | head -n1 | awk '{print $2}' | tr -d '"')"
            tgz="docs/${chart}-${version}.tgz"
            if [ ! -f "${tgz}" ]; then
              echo "::error::Missing packaged chart ${tgz}"
              exit 1
            fi
            cp "${tgz}" "${staging}/"
          done <<< "${CHARTS}"

          helm repo index "${staging}" --merge docs/index.yaml --url https://aerospike.github.io/helm-charts
          mv "${staging}/index.yaml" docs/index.yaml

      - name: Verify packaged chart artifacts
        env:
          CHARTS: ${{ steps.selected-charts.outputs.charts }}
        run: |
          set -euo pipefail

          verification_lines=()

          while IFS= read -r chart; do
            [ -n "${chart}" ] || continue

            version="$(grep '^version:' "${chart}/Chart.yaml" | head -n1 | awk '{print $2}' | tr -d '"')"
            app_version="$(grep '^appVersion:' "${chart}/Chart.yaml" | head -n1 | awk '{print $2}' | tr -d '"')"
            tgz="docs/${chart}-${version}.tgz"

            if [ ! -f "${tgz}" ]; then
              echo "::error::Missing packaged chart ${tgz}"
              exit 1
            fi

            echo "::group::${chart} ${version}"
            echo "Chart.yaml: version=${version} appVersion=${app_version}"
            echo "Artifact: ${tgz}"

            file_digest="$(sha256sum "${tgz}" | awk '{print $1}')"
            echo "sha256: ${file_digest}"

            index_digest="$(ruby -ryaml -e "
              index = YAML.load_file('docs/index.yaml')
              entry = index.dig('entries', '${chart}')&.find { |e| e['version'].to_s == '${version}' }
              abort('missing index entry') unless entry
              puts entry['digest']
            ")"

            if [ "${file_digest}" != "${index_digest}" ]; then
              echo "::error::Digest mismatch for ${tgz}: file=${file_digest} index=${index_digest}"
              exit 1
            fi

            echo "index digest: ${index_digest} (matches)"

            packaged_version="$(helm show chart "${tgz}" | awk '/^version:/ {print $2}' | tr -d '"')"
            packaged_app_version="$(helm show chart "${tgz}" | awk '/^appVersion:/ {print $2}' | tr -d '"')"

            if [ "${packaged_version}" != "${version}" ] || [ "${packaged_app_version}" != "${app_version}" ]; then
              echo "::error::Packaged chart metadata mismatch for ${tgz}"
              echo "expected version=${version} appVersion=${app_version}"
              echo "got version=${packaged_version} appVersion=${packaged_app_version}"
              exit 1
            fi

            echo "--- helm show chart ---"
            helm show chart "${tgz}"
            echo "::endgroup::"

            verification_lines+=("| ${chart} | ${version} | \`${file_digest}\` | verified |")
          done <<< "${CHARTS}"

          {
            echo "package_verification<<EOF"
            printf '%s\n' "${verification_lines[@]}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Build pull request metadata
        id: pr-metadata
        env:
          VERSION_BUMP: ${{ github.event.inputs.version_bump || 'patch' }}
          CHART_VERSION_OVERRIDES: ${{ github.event.inputs.chart_version_overrides }}
          PR_TITLE_INPUT: ${{ github.event.inputs.pr_title }}
          VERSION_SUMMARY: ${{ env.summary }}
          PACKAGE_VERIFICATION: ${{ env.package_verification }}
          FEATURE_BRANCH: ${{ steps.feature-branch.outputs.name }}
          CHECKOUT_REF: ${{ steps.feature-branch.outputs.checkout_ref }}
        run: |
          set -euo pipefail

          should_bump=false
          if [ -n "${CHART_VERSION_OVERRIDES}" ]; then
            should_bump=true
          elif [ -n "${VERSION_BUMP}" ] && [ "${VERSION_BUMP}" != "none" ] && [ "${VERSION_BUMP}" != "skip" ]; then
            should_bump=true
          fi

          if [ -n "${PR_TITLE_INPUT}" ]; then
            title="[${FEATURE_BRANCH}] - ${PR_TITLE_INPUT}"
          else
            release_month_year="$(TZ=Asia/Kolkata date +"%b'%y")"
            title="[${FEATURE_BRANCH}] - [Streaming] Aerospike Streaming Connectors - Security vulnerabilities - ${release_month_year}"
          fi

          {
            echo "title<<EOF"
            echo "${title}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "body<<EOF"
            echo "## Summary"
            echo "- Package selected connector Helm charts into \`docs/\`"
            if [ "${should_bump}" = "true" ]; then
              if [ -n "${CHART_VERSION_OVERRIDES}" ]; then
                echo "- Update chart versions using per-chart overrides and default \`${VERSION_BUMP}\`"
              else
                echo "- Update chart versions in \`Chart.yaml\`, \`appVersion\`, and README image tags (\`${VERSION_BUMP}\`)"
              fi
            fi
            echo "- Regenerate \`docs/index.yaml\` with digests for the newly packaged charts"
            echo ""
            echo "**Feature branch:** \`${FEATURE_BRANCH}\`"
            echo "**Checkout ref:** \`${CHECKOUT_REF}\`"
            echo ""
            if [ "${should_bump}" = "true" ] && [ -n "${VERSION_SUMMARY:-}" ]; then
              echo "## Version updates"
              echo "| Chart | Version |"
              echo "|---|---|"
              echo "${VERSION_SUMMARY}"
              echo ""
            fi
            if [ -n "${PACKAGE_VERIFICATION:-}" ]; then
              echo "## Packaged artifacts"
              echo "| Chart | Version | SHA256 | Status |"
              echo "|---|---|---|---|"
              echo "${PACKAGE_VERIFICATION}"
              echo ""
            fi
            echo "## Test plan"
            echo "- [ ] Verify \`helm repo index\` entries match packaged chart versions"
            echo "- [ ] Confirm chart versions in Chart.yaml match appVersion for selected connectors"
            echo "- [ ] Integration tests passed on the source branch before merge"
            echo ""
            echo "Triggered by @${{ github.actor }} from workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Create or update pull request
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: ${{ steps.feature-branch.outputs.name }}
          delete-branch: false
          commit-message: ${{ steps.pr-metadata.outputs.title }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          reviewers: mphanias,abhilashmandaliya,VivekASHub

      - name: Resolve integration test git ref
        id: test-git-ref
        env:
          HEAD_SHA: ${{ steps.create-pull-request.outputs.pull-request-head-sha }}
          FEATURE_BRANCH: ${{ steps.feature-branch.outputs.name }}
        run: |
          set -euo pipefail

          if [ -n "${HEAD_SHA}" ]; then
            ref="${HEAD_SHA}"
          else
            ref="${FEATURE_BRANCH}"
          fi

          echo "Integration tests will checkout: ${ref}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

  integration-tests:
    needs: package-connector-charts
    if: success()
    uses: ./.github/workflows/connector-integration-tests.yaml
    secrets: inherit
    with:
      aerospike_elasticsearch_outbound: ${{ github.event.inputs.aerospike_elasticsearch_outbound == 'true' }}
      aerospike_esp_outbound: ${{ github.event.inputs.aerospike_esp_outbound == 'true' }}
      aerospike_jms_inbound: ${{ github.event.inputs.aerospike_jms_inbound == 'true' }}
      aerospike_jms_outbound: ${{ github.event.inputs.aerospike_jms_outbound == 'true' }}
      aerospike_kafka_outbound: ${{ github.event.inputs.aerospike_kafka_outbound == 'true' }}
      aerospike_pulsar_outbound: ${{ github.event.inputs.aerospike_pulsar_outbound == 'true' }}
      aerospike_xdr_proxy: ${{ github.event.inputs.aerospike_xdr_proxy == 'true' }}
      git_ref: ${{ needs.package-connector-charts.outputs.git_ref }}
